# Every push and pull request: lint and test on Windows.
# Version tags (v*): also build blackout.exe and publish it as a GitHub Release, with a signed
# build-provenance attestation so anyone can check it was built here from that tag.
#
# Third-party actions are pinned to full commit SHAs (the comment says which release), so a moved
# tag can't change what runs here.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} doesn't match Cargo.toml version $version" }
      - run: cargo build --release --locked
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/blackout.exe
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash target/release/blackout.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  blackout.exe" | Out-File SHA256SUMS.txt -Encoding ascii
          $notes = @(
            "Download **blackout.exe** below and run it. The [README](https://github.com/${{ github.repository }}#download) has the details.",
            "",
            "Windows may show *Windows protected your PC* the first time, because the .exe isn't code-signed. Choose **More info**, then **Run anyway**.",
            "",
            "SHA-256: ``$hash``",
            "",
            "Built by GitHub Actions from this tag. To check: ``gh attestation verify blackout.exe -R ${{ github.repository }}``"
          ) -join "`n"
          gh release create '${{ github.ref_name }}' target/release/blackout.exe SHA256SUMS.txt `
            --repo '${{ github.repository }}' --title 'Blackout ${{ github.ref_name }}' --notes $notes --verify-tag
