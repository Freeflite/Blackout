[package]
name = "blackout"
version = "0.2.0"
edition = "2024"
description = "Tray app that blacks out some or all monitors while the PC and GPU keep working."
license = "BSD-2-Clause"
repository = "https://github.com/Freeflite/Blackout"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "1"
tray-icon = "0.26"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
